<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      property="og:description"
      content="Full-stack developer. I spec it, build it, test it, and ship it."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Rismy Rimasha — Full-stack Developer</title>
    <script>
      // Apply the saved (or system) theme + the active lens before first paint,
      // so there is no theme flash and the accent hue is right on deep links.
      ;(function () {
        var el = document.documentElement
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (!saved && prefersDark)) el.classList.add('dark')
        } catch (e) {
          /* storage blocked — default to light */
        }
        try {
          var lenses = ['engineering', 'qa', 'product']
          var param = new URLSearchParams(location.search).get('lens')
          var stored = null
          try {
            stored = localStorage.getItem('lens')
          } catch (e) {}
          var lens =
            lenses.indexOf(param) > -1
              ? param
              : lenses.indexOf(stored) > -1
                ? stored
                : 'engineering'
          el.setAttribute('data-lens', lens)
        } catch (e) {
          el.setAttribute('data-lens', 'engineering')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
